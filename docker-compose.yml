version: "3.9"

services:
  autoposter:
    build: .
    container_name: autoposter
    restart: unless-stopped
    env_file: .env
    # Порты не открываем напрямую — только через Traefik (docker-compose.prod.yml)
    # Для локальной разработки: docker-compose.override.yml или флаг -p
    volumes:
      - ./data:/app/data   # сессии, БД, медиа — персистентны
    shm_size: "1gb"        # нужно для Chromium
    init: true             # tini как PID 1 — убирает зомби-процессы
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
