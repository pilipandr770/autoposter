# Продакшен-оверрайд: Traefik reverse proxy + закрытые порты
# Использование: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

networks:
  traefik:
    external: true  # Traefik-сеть, уже существующая на Hostinger VPS

services:
  autoposter:
    # Порты не пробрасываем напрямую — только через Traefik
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"

      # ── Web UI → HTTPS ────────────────────────────────────────────────
      - "traefik.http.routers.autoposter.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.autoposter.entrypoints=websecure"
      - "traefik.http.routers.autoposter.tls.certresolver=letsencrypt"
      - "traefik.http.routers.autoposter.service=autoposter"
      - "traefik.http.services.autoposter.loadbalancer.server.port=5000"

      # Редирект HTTP → HTTPS
      - "traefik.http.routers.autoposter-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.autoposter-http.entrypoints=web"
      - "traefik.http.routers.autoposter-http.middlewares=redirect-https"
      - "traefik.http.routers.autoposter-http.service=autoposter"
      - "traefik.http.middlewares.redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-https.redirectscheme.permanent=true"

      # ── noVNC → HTTPS через /novnc/ ───────────────────────────────────
      # Доступ: https://domain.com/novnc/vnc.html
      - "traefik.http.routers.novnc.rule=Host(`${DOMAIN}`) && PathPrefix(`/novnc`)"
      - "traefik.http.routers.novnc.entrypoints=websecure"
      - "traefik.http.routers.novnc.tls.certresolver=letsencrypt"
      - "traefik.http.routers.novnc.service=novnc"
      - "traefik.http.services.novnc.loadbalancer.server.port=6080"
      - "traefik.http.middlewares.strip-novnc.stripprefix.prefixes=/novnc"
      - "traefik.http.routers.novnc.middlewares=strip-novnc"
