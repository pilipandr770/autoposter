# Локальная разработка — пробрасываем порты напрямую
# Применяется автоматически при: docker compose up
# Для продакшена использовать: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: "3.9"

services:
  autoposter:
    ports:
      - "5000:5000"   # Web UI
      - "6080:6080"   # noVNC (встроенный браузер)
